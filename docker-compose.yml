services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videofarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videofarm}
      POSTGRES_DB: ${POSTGRES_DB:-videofarm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videofarm} -d ${POSTGRES_DB:-videofarm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-admin}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - N8N_RUNNERS_ENABLED=true
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-videofarm}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-videofarm}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-videofarm}
      - DB_POSTGRESDB_SCHEMA=n8n
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

  render-service:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - NODE_ENV=production
      - PORT=7000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-videofarm}:${POSTGRES_PASSWORD:-videofarm}@postgres:5432/${POSTGRES_DB:-videofarm}
      - RENDER_SECRET=${RENDER_SECRET:-change-me}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - render
    volumes:
      - ./render-service/output:/app/render-service/output
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:7000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  n8n_data:
